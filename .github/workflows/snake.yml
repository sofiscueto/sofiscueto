name: Gerar cobrinha

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia, meia-noite no horário de Brasília
  workflow_dispatch:       # permite rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#c4b5fd,#a78bfa,#7c3aed,#4c1d95
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FACC15&color_dots=#161b22,#2e1065,#4c1d95,#6d28d9,#a5b4fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
